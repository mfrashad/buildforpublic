  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap");
  .t{font-family:"Plus Jakarta Sans",Arial,sans-serif;} .name{font-weight:800;font-size:22px;} .hex{font-weight:700;font-size:18px;fill:#666;} .use{font-weight:700;font-size:13px;fill:#999;letter-spacing:.04em;} .title{font-weight:800;font-size:40px;letter-spacing:-1px;} .sub{font-weight:700;font-size:18px;fill:#666;}</style></defs>
